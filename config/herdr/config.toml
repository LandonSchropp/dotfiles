onboarding = false

[keys]
previous_tab = "cmd+h"
next_tab = "cmd+l"
new_tab = "cmd+t"
rename_tab = "cmd+r"
previous_workspace = "cmd+k"
next_workspace = "cmd+j"
close_workspace = "cmd+shift+w"
rename_workspace = "cmd+shift+r"
switch_workspace = "cmd+1..9"
toggle_sidebar = "cmd+s"
help = "cmd+/"
copy_mode = "cmd+m"

[[keys.command]]
key = "cmd+n"
type = "plugin_action"
command = "landonschropp.herdr-project.project"
description = "new workspace"

[[keys.command]]
key = "cmd+shift+n"
type = "plugin_action"
command = "landonschropp.herdr-project.worktree"
description = "new worktree"

[[keys.command]]
key = "cmd+w"
type = "popup"
command = "confirm-close-tab"
description = "close tab"
width = "40%"
height = "20%"

[theme]
name = "tokyo-night"

[ui]
agent_panel_sort = "spaces"
confirm_close = true
show_agent_labels_on_pane_borders = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
rows = []

[ui.sound]
enabled = false
