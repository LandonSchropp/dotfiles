onboarding = false

[keys]
previous_tab = "cmd+h"
next_tab = "cmd+l"
new_tab = "cmd+t"
rename_tab = "cmd+r"
close_workspace = "cmd+shift+w"
rename_workspace = "cmd+shift+r"
toggle_sidebar = "cmd+s"
help = "cmd+/"
copy_mode = "cmd+m"

[[keys.command]]
key = "cmd+n"
type = "plugin_action"
command = "landonschropp.herdr-project.project"
description = "new workspace"

[[keys.command]]
key = "cmd+j"
type = "plugin_action"
command = "landonschropp.herdr-group.next"
description = "next workspace"

[[keys.command]]
key = "cmd+k"
type = "plugin_action"
command = "landonschropp.herdr-group.previous"
description = "previous workspace"

[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "landonschropp.herdr-group.park"
description = "toggle parked"

[[keys.command]]
key = "cmd+w"
type = "popup"
command = "confirm-close-tab"
description = "close tab"
width = "40%"
height = "20%"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
confirm_close = true
show_agent_labels_on_pane_borders = false

[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    { token = "workspace", rules = [{ contains = "───", fg = "#565f89" }, { contains = "", hide = true }] },
    { token = "$name", fg = "#c0caf5" },
    { token = "$parked", fg = "#565f89" },
  ],
  ["$project_name", { token = "$parked_project", fg = "#565f89" }],
  # Pull request statuses, in Tokyo Night colors. Warm colors mean someone has work to do: red is
  # broken, orange is a person's feedback and yellow is a bot's. Cool colors mean nothing is needed
  # yet: blue is CI or the merge queue running and cyan is waiting on a reviewer. Draft is gray,
  # ready is green and merged is purple, like GitHub. Every group gets its own color. Pink
  # (#fca7ea) is held in reserve for a future status, since it fits the palette and looks unlike
  # every color in use.
  [
    { token = "$pull_request_status_broken", fg = "#f7768e" },
    { token = "$pull_request_status_feedback", fg = "#ff9e64" },
    { token = "$pull_request_status_bot", fg = "#e0af68" },
    { token = "$pull_request_status_running", fg = "#7aa2f7" },
    { token = "$pull_request_status_waiting", fg = "#7dcfff" },
    { token = "$pull_request_status_draft", fg = "#737aa2" },
    { token = "$pull_request_status_ready", fg = "#9ece6a" },
    { token = "$pull_request_status_merged", fg = "#bb9af7" },
  ],
]

[ui.sidebar.agents]
rows = []

[ui.sound]
enabled = false
