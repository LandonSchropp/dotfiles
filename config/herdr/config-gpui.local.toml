# Herdr UI overrides. Saved changes reload automatically.
# Unset keys inherit config-gpui.toml; tables merge key by key.

# New installs start with the roomy rounded sidebar. Remove this line for
# the managed default, or pick another layout listed in config-gpui.toml.
layout = "comfortable-rounded"
theme = "TokyoNight Storm"
show_system_load = false
tab_layout = "curved"
show_agents = false
show_sidebar_search = false

[sidebar]
device_footer = "auto"
change_counts = "local"
family = "JetBrainsMono Nerd Font"
size = 16.0

[terminal]
family = "JetBrainsMono Nerd Font"
size = 18.0
line_height = 1.65

[tabs]
family = "JetBrainsMono Nerd Font"
size = 16.0

[status_bar]
theme = "hidden"
shortcuts = "hidden"
report_issue = "hidden"
keep_awake_scope = "system"

[ui]
size = 16.0
