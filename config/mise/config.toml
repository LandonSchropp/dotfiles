[tools]
bun = "latest"
elixir = "latest"
erlang = "latest"
node = "latest"
pnpm = "latest"
python = "latest"
ruby = { version = "latest", postinstall = "gem install rubocop rubocop-shopify" }
rust = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "ruby", "elixir", "yarn"]

[env]
GOMODCACHE = "{{env.HOME}}/.cache/go/mod"
