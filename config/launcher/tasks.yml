- name: daily-update
  description: Run the quick, low-risk updates that keep the machine current day-to-day.
  command: daily-update
  cron: "0 7,15 * * *"

- name: weekly-update
  description: Run the slower, less urgent updates once a week.
  command: weekly-update
  cron: "0 13 * * 5"

- name: enable-screen-tint
  description: Enable the screen tint shortcut in the evening.
  command: 'shortcuts run "Enable Screen Tint"'
  cron: "0 21 * * *"

- name: disable-screen-tint
  description: Disable the screen tint shortcut in the morning.
  command: 'shortcuts run "Disable Screen Tint"'
  cron: "0 7 * * *"

- name: plan-day
  description: Run the daily planning prompt, on weekdays at work and on weekends at home.
  command: |
    if [[ $(hostname -s) == BL* ]]; then days=12345; else days=67; fi

    if [[ $days == *$(date +%u)* ]]; then
      herdr-project open --project notes --name plan-day --prompt "/plan-day"
    fi
  cron: "0 7 * * *"
