theme = "tokyo-night-storm"
mode = "unified"
line_numbers = false
wrap_lines = true
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

[keybindings]
"hunk.app.quit" = "ctrl+c"
"hunk-review.review" = ["q", "ctrl+r"]
"hunk.review.halfPageDown" = "ctrl+d"
"hunk.review.halfPageUp" = "ctrl+u"
"hunk.review.replyToActiveNote" = "r"
"hunk.app.refresh" = "R"
"hunk.review.editActiveNote" = "e"
"hunk.review.editSelectedFile" = "E"
"hunk.review.deleteActiveNote" = "d"

# Not linked by rcup: Hunk's React shim doesn't follow symlinks.
[extensions]
paths = ["~/.dotfiles/hunk/extensions"]

# Tokyo Night Storm, matching Ghostty and Neovim.
[themes.tokyo-night-storm]
base = "tokyo-night"
label = "Tokyo Night Storm"
background = "#24283b"
contextBg = "#24283b"
contextContentBg = "#24283b"
lineNumberBg = "#24283b"
panel = "#1f2335"
panelAlt = "#292e42"
noteBackground = "#1f2335"
noteTitleBackground = "#1f2335"
